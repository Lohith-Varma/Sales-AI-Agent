version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sales_copilot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales_copilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run the core, AI, and frontend processes with the variables documented in
  # ../.env.example. Production startup requires JWT_SECRET,
  # INTERNAL_API_KEY, ENCRYPTION_KEY, and GEMINI_API_KEY.

volumes:
  postgres_data:
  redis_data:
